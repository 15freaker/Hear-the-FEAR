<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hear the Fear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" src="assests/sounds/bg-music.mp3" loop></audio>
    <audio id="clickAudio" src="assests/sounds/click-audio.mp3"></audio>
    <div class="container image-one">
        <img src="assests/simg1.jpg">
    </div>

    <div class="container image-two">
        <img src="assests/simg2.jpg">
    </div>

    <div class="container image-three">
        <img src="assests/simg3.jpg">
    </div>
    
    <main>
        <h1>Hear the <span>FEAR</span></h1>
        <p class="headphone-text">
            Use headphones to experience the fear
        </p>
        <p class="question">
            Are you in headphones ?
        </p>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
        <p id="message"></p>
    </main>
    <div id="doorScene">
        <img id="doorImage" src="assests/doorimg.png">
        <div id="interactBox">
            INTERACT
        </div>
        <div id="controlsHint">
            W / ↑ — Move Forward<br>
            S / ↓ — Move Back<br>
            A / ← — Turn Left<br>
            D / → — Turn Right
        </div>
        <video id="doorVideo" src="assests/starting-door.mp4"></video>
        <audio id="doorAudio" src="assests/sounds/dooraudio.mp3"></audio>
    </div>
<div id="horrorPath">
    <div id="horrorWorld">
        <div class="ghost ghost-left" data-position="100">
            <img src="assests/simg1.jpg">
            <audio src="assests/sounds/aud1.mp3" loop></audio>
        </div>
        <div class="ghost ghost-right" date-position="300">
            <img src="assests/simg2.jpg">
            <audio src="assests/sounds/aud2.mp3" loop></audio>
        </div>

        <div class="ghost ghost-left" data-position="500">
            <img src="assests/simg3.jpg">
            <audio src="assests/sounds/aud3.mp3" loop></audio>
        </div>
        <div class="ghost ghost-right" data-position="700">
            <img src="assests/simg2.jpg">
            <audio src="assests/sounds/aud4.mp3" loop>
            </audio>
        </div>
        <div class="ghost ghost-left" data-position="900">
            <img src="assests/simg1.jpg">
            <audio src="assests/sounds/aud5.mp3"loop></audio>
        </div>
        <div class="ghost ghost-right" data-position="1100">
            <img src="assests/simg3.jpg">
            <audio src="assests/sounds/aud6.mp3" loop></audio>
        </div>
        <div class="ghost ghost-left" data-position="1500">
            <img src="assests/simg2.jpg">
            <audio src="assests/aounds/aud8.mp3"loop></audio>
        </div>
        <div class="ghost ghost-right" data-position="1700">
            <img src="assests/simg1.jpg">
            <audio src="assests/sounds/aud9.mp3" loop></audio>
        </div>
        <div class="ghost ghost-left" data-position="1900">
            <img src="assests/simg3.jpg">
            <audio src="assests/sounds/aud10.mp3 loop"></audio>
        </div>
    </div>
    <div id="pathControls">
           W / ↑ — Move Forward<br>
           S / ↓ — Move Back
    </div>
    </div>
</div>
    <script src="script.js"></script>
    </body>
    </html>
