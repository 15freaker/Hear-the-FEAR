<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hear the Fear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" src="assests/sounds/bg-music.mp3" loop></audio>
    <audio id="clickAudio" src="assests/sounds/click-audio.mp3"></audio>
    <div class="container image-one">
        <img src="assests/simg1.jpg">
    </div>
    <div class="container image-two">
        <img src="assests/simg2.jpg">
    </div>
    <div class="container image-three">
        <img src="assests/simg3.jpg">
    </div>
    <main id="startScreen">
        <h1>Hear the <span>FEAR</span></h1>
        <p class="headphone-text">
            Use headphones to experience the fear
        </p>
        <p class="question">
            Are you in headphones ?
        </p>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
        <p id="message"></p>
    </main>

    <div id="doorScene">
        <img id="doorImage" src="assests/doorimg.png">
        <div id="interactBox">
            INTERACT
        </div>
        <div id="controlsHint">
            W / ↑ — Move Forward<br>
            S / ↓ — Move Back<br>
            A / ← — Turn Left<br>
            D / → — Turn Right
        </div>
        <video id="doorVideo" src="assests/starting-door.mp4"></video>
        <audio id="doorAudio" src="assests/sounds/dooraudio.mp3"></audio>
    </div>
    <div id="strangerScene">
    <div id="strangerWorld">
        <div id="stranger">
            <div id="strangerHead"></div>
            <div id="strangerBody"></div>
        </div>
    </div>
    <div id="dialogueBox">
        <div id="speakerName">
            STRANGER
        </div>
        <div id="dialogueText">
        </div>
        <div id="choiceContainer">
            <button class="dialogueChoice" id="choice1"></button>
            <button class="dialogueChoice" id="choice2"></button>
        </div>
    </div>
    <audio id="talkAudio" src="assests/sounds/talk.mp3"></audio>
    <audio id="dialogueClickAudio" src="assests/sounds/click-audio.mp3"></audio>
    <audio id="strangerStep1" src="assests/sounds/step1.mp3"></audio>
    <audio id="strangerStep2" src="assests/sounds/step2.mp3"></audio>
</div>

<div id="pathwayScene">
    <div id="pathwayWorld">
        <div class="pathImage left" id="pathImage1"><img src="assests/img1.jpg"></div>
        <div class="pathImage right" id="pathImage2"><img src="assests/img2.jpg"></div>
        <div class="pathImage left" id="pathImage3"><img src="assests/img3.jpg"></div>
        <div class="pathImage right" id="pathImage4"><img src="assests/img4.jpg"></div>
        <div class="pathImage left" id="pathImage5"><img src="assests/img5.jpg"></div>
        <div class="pathImage right" id="pathImage6"><img src="assests/img6.jpg"></div>
        <div class="pathImage left" id="pathImage7"><img src="assests/img7.jpg"></div>
        <div class="pathImage right" id="pathImage8"><img src="assests/img8.jpg"></div>
        <div class="pathImage left" id="pathImage9"><img src="assests/img9.jpg"></div>
        <div class="pathImage right" id="pathImage10"><img src="assests/img10.jpg"></div>
    </div>
    <div id="pathwayControls">
        W / ↑ — Move Forward<br>
        S / ↓ — Move Back
    </div>
</div>

<audio id="pathAudio1" src="assests/sounds/1.mp3"></audio>
<audio id="pathAudio2" src="assests/sounds/2.mp3"></audio>
<audio id="pathAudio3" src="assests/sounds/3.mp3"></audio>
<audio id="pathAudio4" src="assests/sounds/4.mp3"></audio>
<audio id="pathAudio5" src="assests/sounds/5.mp3"></audio>
<audio id="pathAudio6" src="assests/sounds/6.mp3"></audio>
<audio id="pathAudio7" src="assests/sounds/7.mp3"></audio>
<audio id="pathAudio8" src="assests/sounds/8.mp3"></audio>
<audio id="pathAudio9" src="assests/sounds/9.mp3"></audio>
<audio id="pathAudio10" src="assests/sounds/10.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
